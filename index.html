<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        if (window.location.pathname.indexOf('/app_planificacion') !== -1 && window.location.pathname.indexOf('index.php') === -1) {
          window.location.replace('./index.php');
          return;
        }
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (nativeFetch) {
            Object.defineProperty(window, 'fetch', {
              value: nativeFetch,
              writable: true,
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = String((event && event.reason) || '');
            if (
              reason.indexOf('WebSocket closed without opened') !== -1 ||
              reason.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
